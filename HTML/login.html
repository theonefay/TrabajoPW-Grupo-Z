<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="/CSS/style-login.css">
    <link rel="icon" href="/img/esfera.png" type="image/png">

<body>
    <div class="fondo">
         <header>
            <div class="caja img">
                <a href="Index.html"><img src="/img/esfera.png" class="img-logo"></a>
            </div>
            <div class="caja medio">
            </div>
            <div class="caja login-header-logo">

            </div >
        </header>
    <main>
        <form class="formulario">
            <h2>LOGIN</h2>
            <div class="campo">

            <div class="campo">

            </div>
            <div class="div-btn">

            </div>
            <div class="div-recup-contraseña">
                ¿Olvidaste tu contraseña?

    </main>
    </div>
