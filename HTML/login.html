        <form class="formulario">

            <label for="campo-contraseña">Contraseña</label>
            <input class="campo" type="password" placeholder="" id="campo-contraseña" required>

            <p id="recuperar-contrasenia">¿Olvidaste tu contraseña?
                <a href="recuperar-password.html">Click aqui</a>
            </p>

            <button type="submit">Iniciar sesión</button>
            
            <p id="registrarse">¿No tienes una cuenta?
                <a href="formulario-registro.html">Registrate</a>
            </p>
        </form>
