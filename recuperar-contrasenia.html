<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperacion de contraseña</title>
    <link rel="stylesheet" href="./CSS/style-recuperar-contrasenia.css">
    <link rel="icon" href="/img/esfera.png" type="image/png">
</head>

<body>
    <header class="cotenedor-nav">
        <nav class="barra-nav">
            <div class="icono-inicio">
                <a href="./Index.html">
                    <img src="./img/esfera.png" alt="" width="30">

            </div>
            <ul>
                <li><a href="#">Albun</a></li>
                <li><a href="./login.html">Volver</a></li>
            </ul>
        </nav>

    <main>
        <form action="" class="formulario">
            <h2>Recuperar contraseña</h2>
            <p>Ingrese su email y usuario para cambiar la contraseña</p>

            <label for="email">E-mail</label>
            <input type="text" required id="email" class="campo">

            <label for="usuario">Usuario</label>
            <input type="text" required id="usuario" class="campo">
            
            <button type="submit" class="boton-enviar">Continuar</button>
        </form>
    </main>

    <footer>
    </footer>
